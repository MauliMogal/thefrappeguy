name: Copy check

on:
  pull_request:
    paths:
      - "thefrappeguy/data/**"
      - "tools/check_copy.py"
  push:
    branches: [main]
    paths:
      - "thefrappeguy/data/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Brand rules on the comic copy
        run: python3 tools/check_copy.py
